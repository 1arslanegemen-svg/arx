<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c2a2a"/><stop offset=".55" stop-color="#0a1418"/><stop offset="1" stop-color="#14122a"/></linearGradient>
    <linearGradient id="plat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#cfe9e4"/><stop offset="1" stop-color="#8fb3ad"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2bb59a"/><stop offset="1" stop-color="#7ff5dc"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#5ee0c4"/></linearGradient>
    <radialGradient id="glow" cx=".82" cy=".42" r=".5"><stop offset="0" stop-color="#5ee0c4" stop-opacity=".34"/><stop offset="1" stop-color="#5ee0c4" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx=".1" cy=".05" r=".55"><stop offset="0" stop-color="#7c5cff" stop-opacity=".28"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ee0c4" stop-opacity=".2"/><stop offset="1" stop-color="#5ee0c4" stop-opacity="0"/></linearGradient>
    <pattern id="hex" width="48" height="41.57" patternUnits="userSpaceOnUse" patternTransform="scale(.9)">
      <path d="M12 0h24l12 20.78-12 20.79H12L0 20.78z" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width="1.2"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#hex)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>
  <rect width="1200" height="400" fill="url(#glow2)"/>

  <!-- two converging market lines: partnership -->
  <path d="M0 350 L140 338 L260 344 L380 306 L500 318 L620 270 L740 282 L860 222 L980 210 L1200 150 L1200 400 L0 400Z" fill="url(#fill)"/>
  <path d="M0 300 L130 318 L250 296 L370 326 L490 290 L610 300 L730 256 L850 232 L980 210" fill="none" stroke="#a78bfa" stroke-opacity=".7" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 9"/>
  <path d="M0 350 L140 338 L260 344 L380 306 L500 318 L620 270 L740 282 L860 222 L980 210 L1200 150" fill="none" stroke="url(#teal)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="980" cy="210" r="9" fill="#7ff5dc"/><circle cx="980" cy="210" r="20" fill="#7ff5dc" fill-opacity=".18"/>

  <!-- platinum diagonal accents -->
  <g stroke="url(#plat)" stroke-opacity=".16" stroke-width="2">
    <path d="M720 0 L980 400"/><path d="M780 0 L1040 400"/>
  </g>

  <!-- partner emblem: hexagon with interlinked rings -->
  <g transform="translate(1000 168)">
    <path d="M0 -112 L97 -56 L97 56 L0 112 L-97 56 L-97 -56 Z" fill="#081416" stroke="url(#plat)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M0 -98 L85 -49 L85 49 L0 98 L-85 49 L-85 -49 Z" fill="none" stroke="#5ee0c4" stroke-opacity=".3" stroke-width="2" stroke-linejoin="round"/>
    <g transform="translate(0 -14)" fill="none" stroke-width="10">
      <circle cx="-20" cy="0" r="30" stroke="url(#teal)"/>
      <circle cx="20" cy="0" r="30" stroke="url(#plat)"/>
      <path d="M-20 -30 A30 30 0 0 1 4.5 -17.2" stroke="url(#teal)"/>
    </g>
    <text y="62" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="900" letter-spacing="5" fill="url(#plat)">PARTNER</text>
  </g>

  <!-- sparkles -->
  <g fill="#dffcf5">
    <path d="M870 64 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" opacity=".75"/>
    <path d="M1136 318 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" opacity=".6"/>
    <path d="M610 120 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z" opacity=".5"/>
  </g>

  <!-- wordmark (kept low and central, clear of profile buttons) -->
  <g transform="translate(360 170)">
    <rect x="-8" y="-8" width="96" height="96" rx="24" fill="#0b1c1d" stroke="url(#plat)" stroke-opacity=".55" stroke-width="2"/>
    <g transform="scale(.16)">
      <path d="M342 140 A130 130 0 1 0 352 330" fill="none" stroke="url(#brand)" stroke-width="46" stroke-linecap="round"/>
      <path d="M330 150 L400 92" stroke="#5ee0c4" stroke-width="46" stroke-linecap="round"/>
      <path d="M342 72 h66 a12 12 0 0 1 12 12 v66" fill="none" stroke="#5ee0c4" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="108" y="44" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="2" fill="#ffffff">COINFORCE</text>
    <text x="110" y="82" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4" fill="url(#teal)">OFFICIAL PARTNER</text>
  </g>
</svg>
