<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1530"/><stop offset=".55" stop-color="#100c1e"/><stop offset="1" stop-color="#1a1408"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1b8"/><stop offset=".45" stop-color="#f2c14e"/><stop offset="1" stop-color="#b8862b"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#5ee0c4"/></linearGradient>
    <radialGradient id="glow" cx=".8" cy=".35" r=".5"><stop offset="0" stop-color="#f2c14e" stop-opacity=".32"/><stop offset="1" stop-color="#f2c14e" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx=".15" cy=".1" r=".5"><stop offset="0" stop-color="#7c5cff" stop-opacity=".35"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2c14e" stop-opacity=".22"/><stop offset="1" stop-color="#f2c14e" stop-opacity="0"/></linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".06"/></pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#dots)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>
  <rect width="1200" height="400" fill="url(#glow2)"/>
  <!-- gold diagonal lines -->
  <g stroke="url(#gold)" stroke-opacity=".25" stroke-width="2">
    <path d="M760 0 L1040 400"/><path d="M820 0 L1100 400"/><path d="M880 0 L1160 400"/>
  </g>
  <!-- rising gold market line -->
  <path d="M0 340 L120 330 L220 336 L320 300 L420 310 L520 268 L620 280 L720 230 L820 242 L920 180 L1020 196 L1200 120 L1200 400 L0 400Z" fill="url(#fill)"/>
  <path d="M0 340 L120 330 L220 336 L320 300 L420 310 L520 268 L620 280 L720 230 L820 242 L920 180 L1020 196 L1200 120" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- big crown emblem -->
  <g transform="translate(985 150)">
    <circle r="105" fill="#0e0a18" stroke="url(#gold)" stroke-width="6"/>
    <circle r="92" fill="none" stroke="#f2c14e" stroke-opacity=".25" stroke-width="2"/>
    <g transform="translate(0 -6)">
      <path d="M-62 34 L-54 -14 L-26 12 L0 -30 L26 12 L54 -14 L62 34 Z" fill="url(#gold)" stroke="#7a5a12" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="-65" y="32" width="130" height="15" rx="6" fill="url(#gold)" stroke="#7a5a12" stroke-width="2.5"/>
      <circle cx="0" cy="-31" r="7" fill="#5ee0c4"/><circle cx="-54" cy="-16" r="6" fill="#a78bfa"/><circle cx="54" cy="-16" r="6" fill="#a78bfa"/>
    </g>
    <text y="76" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="900" letter-spacing="6" fill="url(#gold)">CEO</text>
  </g>
  <!-- sparkles -->
  <g fill="#fff1b8">
    <path d="M860 70 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" opacity=".8"/>
    <path d="M1120 300 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" opacity=".7"/>
  </g>
  <!-- wordmark -->
  <g transform="translate(360 112)">
    <rect x="-8" y="-8" width="96" height="96" rx="24" fill="#18122c" stroke="url(#gold)" stroke-opacity=".6" stroke-width="2"/>
    <g transform="scale(.16)">
      <path d="M342 140 A130 130 0 1 0 352 330" fill="none" stroke="url(#brand)" stroke-width="46" stroke-linecap="round"/>
      <path d="M330 150 L400 92" stroke="#5ee0c4" stroke-width="46" stroke-linecap="round"/>
      <path d="M342 72 h66 a12 12 0 0 1 12 12 v66" fill="none" stroke="#5ee0c4" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="108" y="44" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="2" fill="#ffffff">COINFORCE</text>
    <text x="110" y="82" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4" fill="url(#gold)">FOUNDER &amp; CEO</text>
  </g>
</svg>
