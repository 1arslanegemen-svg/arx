<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx=".35" cy=".25" r=".9"><stop offset="0" stop-color="#2a2140"/><stop offset=".6" stop-color="#140f22"/><stop offset="1" stop-color="#0a0812"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1b8"/><stop offset=".45" stop-color="#f2c14e"/><stop offset="1" stop-color="#b8862b"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#5ee0c4"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="268" r="214" fill="none" stroke="url(#gold)" stroke-width="10" opacity=".9"/>
  <circle cx="256" cy="268" r="196" fill="none" stroke="#f2c14e" stroke-opacity=".18" stroke-width="2"/>
  <!-- crown -->
  <g transform="translate(256 92)">
    <path d="M-86 52 L-74 -14 L-36 22 L0 -38 L36 22 L74 -14 L86 52 Z" fill="url(#gold)" stroke="#7a5a12" stroke-width="3" stroke-linejoin="round"/>
    <rect x="-90" y="50" width="180" height="20" rx="8" fill="url(#gold)" stroke="#7a5a12" stroke-width="3"/>
    <circle cx="0" cy="-40" r="9" fill="#5ee0c4"/><circle cx="-74" cy="-16" r="8" fill="#a78bfa"/><circle cx="74" cy="-16" r="8" fill="#a78bfa"/>
    <circle cx="0" cy="60" r="6" fill="#5ee0c4"/><circle cx="-42" cy="60" r="5" fill="#a78bfa"/><circle cx="42" cy="60" r="5" fill="#a78bfa"/>
  </g>
  <!-- C + arrow logo -->
  <g transform="translate(118 168) scale(.56)">
    <path d="M342 140 A130 130 0 1 0 352 330" fill="none" stroke="url(#brand)" stroke-width="46" stroke-linecap="round"/>
    <path d="M330 150 L400 92" stroke="#5ee0c4" stroke-width="46" stroke-linecap="round"/>
    <path d="M342 72 h66 a12 12 0 0 1 12 12 v66" fill="none" stroke="#5ee0c4" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- CEO ribbon -->
  <g transform="translate(256 430)">
    <rect x="-78" y="-26" width="156" height="52" rx="26" fill="#0a0812" stroke="url(#gold)" stroke-width="5"/>
    <text x="0" y="13" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="36" font-weight="900" letter-spacing="6" fill="url(#gold)">CEO</text>
  </g>
