<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241a4a"/>
      <stop offset=".55" stop-color="#16122e"/>
      <stop offset="1" stop-color="#0b1a24"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#5ee0c4"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ee0c4" stop-opacity=".28"/>
      <stop offset="1" stop-color="#5ee0c4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".45" r=".45">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1ff"/>
      <stop offset="1" stop-color="#b9c0e6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- circuit traces -->
  <g fill="none" stroke="#5ee0c4" stroke-opacity=".35" stroke-width="2" stroke-linecap="round">
    <path d="M0 70h140l30 30h120"/>
    <path d="M1200 60h-120l-30 30h-60"/>
    <path d="M1200 330h-90l-26-26h-70"/>
    <path d="M330 0v40l24 24h90"/>
  </g>
  <g fill="#5ee0c4" fill-opacity=".6">
    <circle cx="290" cy="100" r="5"/><circle cx="990" cy="90" r="5"/><circle cx="1014" cy="304" r="5"/><circle cx="444" cy="64" r="5"/>
  </g>

  <!-- rising market line -->
  <path d="M0 330 L90 318 L170 324 L250 296 L330 304 L410 268 L490 280 L570 236 L650 250 L730 206 L810 222 L890 170 L970 186 L1050 132 L1200 120 L1200 400 L0 400Z" fill="url(#fill)"/>
  <path d="M0 330 L90 318 L170 324 L250 296 L330 304 L410 268 L490 280 L570 236 L650 250 L730 206 L810 222 L890 170 L970 186 L1050 132 L1200 120" fill="none" stroke="url(#brand)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- candles -->
  <g stroke-width="3" stroke-linecap="round" transform="translate(150 120)">
    <g stroke="#3ddc97" fill="#3ddc97"><path d="M520 150v70"/><rect x="511" y="165" width="18" height="38" rx="3"/></g>
    <g stroke="#ff6b6b" fill="#ff6b6b"><path d="M556 160v52"/><rect x="547" y="172" width="18" height="26" rx="3"/></g>
    <g stroke="#3ddc97" fill="#3ddc97"><path d="M592 118v80"/><rect x="583" y="128" width="18" height="52" rx="3"/></g>
  </g>

  <!-- logo + wordmark -->
  <g transform="translate(360 110)">
    <rect x="-8" y="-8" width="96" height="96" rx="24" fill="#1b1538" stroke="#ffffff" stroke-opacity=".08"/>
    <g transform="translate(0 0) scale(.16)">
      <path d="M342 140 A130 130 0 1 0 352 330" fill="none" stroke="url(#brand)" stroke-width="46" stroke-linecap="round"/>
      <path d="M330 150 L400 92" stroke="#5ee0c4" stroke-width="46" stroke-linecap="round"/>
      <path d="M342 72 h66 a12 12 0 0 1 12 12 v66" fill="none" stroke="#5ee0c4" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="108" y="44" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="2" fill="#ffffff">COINFORCE</text>
    <g transform="translate(110 62)">
      <rect width="96" height="30" rx="15" fill="#4fc3f7" fill-opacity=".18" stroke="#4fc3f7" stroke-opacity=".6"/>
      <text x="48" y="21" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="3" fill="#4fc3f7">BOT</text>
    </g>
    <text x="222" y="84" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#ffffff" fill-opacity=".6">Otomatik işlem · 7/24</text>
  </g>

  <!-- friendly robot -->
  <g transform="translate(905 70)">
    <ellipse cx="80" cy="262" rx="78" ry="10" fill="#000" fill-opacity=".35"/>
    <!-- antenna -->
    <path d="M80 22v-26" stroke="#b9c0e6" stroke-width="6" stroke-linecap="round"/>
    <circle cx="80" cy="-10" r="11" fill="#5ee0c4"/>
    <circle cx="80" cy="-10" r="20" fill="#5ee0c4" fill-opacity=".2"/>
    <!-- head -->
    <rect x="12" y="20" width="136" height="104" rx="30" fill="url(#metal)"/>
    <rect x="28" y="40" width="104" height="62" rx="20" fill="#14102b"/>
    <circle cx="58" cy="70" r="11" fill="#5ee0c4"/><circle cx="102" cy="70" r="11" fill="#5ee0c4"/>
    <circle cx="61" cy="67" r="3.5" fill="#fff"/><circle cx="105" cy="67" r="3.5" fill="#fff"/>
    <path d="M66 90 q14 10 28 0" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>
    <rect x="0" y="54" width="14" height="36" rx="6" fill="#a78bfa"/><rect x="146" y="54" width="14" height="36" rx="6" fill="#a78bfa"/>
    <!-- neck + body -->
    <rect x="64" y="124" width="32" height="14" rx="4" fill="#9aa2cf"/>
    <rect x="22" y="136" width="116" height="104" rx="26" fill="url(#metal)"/>
    <rect x="44" y="156" width="72" height="46" rx="12" fill="#14102b"/>
    <path d="M52 192 L66 180 L78 186 L92 168 L108 174" fill="none" stroke="#3ddc97" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="60" cy="220" r="6" fill="#a78bfa"/><circle cx="80" cy="220" r="6" fill="#5ee0c4"/><circle cx="100" cy="220" r="6" fill="#ff6b6b"/>
    <!-- arms -->
    <path d="M22 160 q-30 10 -34 46" fill="none" stroke="#b9c0e6" stroke-width="14" stroke-linecap="round"/>
    <circle cx="-12" cy="210" r="12" fill="#a78bfa"/>
    <path d="M138 158 q30 -8 36 -44" fill="none" stroke="#b9c0e6" stroke-width="14" stroke-linecap="round"/>
    <!-- coin in hand -->
    <circle cx="178" cy="104" r="20" fill="#f2b705"/>
    <circle cx="178" cy="104" r="14" fill="none" stroke="#fff3c4" stroke-width="3"/>
    <text x="178" y="111" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="19" font-weight="900" fill="#7a5600">$</text>
  </g>
</svg>
